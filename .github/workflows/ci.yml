name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sözdizimi kontrolü
        run: python -m compileall -q app run.py
      - name: İçe aktarma kontrolü
        run: python -c "from app.main import main; import app.tunnel_setup; print('ok')"
